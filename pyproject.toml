[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steelfire"
version = "1.1.0"
description = "Structural steel in fire: ISO 834 and parametric fire curves, EN 1993-1-2 steel temperature, critical temperature and 2D thermal FEA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["fire", "structural-fire-engineering", "steel", "eurocode", "EN-1993-1-2", "ISO-834", "thermal-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
analytic = ["sympy>=1.12"]
memos = ["handcalcs>=1.6"]
test = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
    "pytest-cov>=4.0",
    "httpx>=0.24",
]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "httpx>=0.25",
]

[project.urls]
Homepage = "https://github.com/jmurgass99/steelfire"
Repository = "https://github.com/jmurgass99/steelfire"
Issues = "https://github.com/jmurgass99/steelfire/issues"

[tool.setuptools.packages.find]
include = ["steelfire*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "api: tests REST API endpoints",
    "characterization: captura el estado ACTUAL de la implementacion (valor obtenido ejecutando el codigo, NO de una fuente normativa)",
]

[tool.coverage.run]
branch = true
source = ["steelfire"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true
